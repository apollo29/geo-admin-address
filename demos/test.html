<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TEST</title>

    <script
            src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script src="../public/atk-google-maps.min.js"></script>
    <script>
        $(document).ready(function() {
            console.log( "ready!" );
            jQuery.fn.extend({
                atkGeoAdminLookup: function() {
                    console.log("atkGeoAdminLookup", this);
                    this.on("input", function() {
                        let value = $(this).val();
                        if (value.length > 2) {
                            $.ajax({
                                url: "https://api.geo.admin.ch/rest/services/api/SearchServer?searchText=" + value + "&type=locations&lang=de&origins=address&limit=10",
                                dataType: "json",
                                success: function(data) {
                                    console.log(data);
                                    if (data.results.length > 0) {
                                        console.log(data.results);
                                    }
                                }
                            })
                            console.log( "Handler for `input` called.", $(this).val());
                        }
                    });
                }
            });


            $('#address').atkGeoAdminLookup();
        });
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1>geo-admin-address</h1>
        <div class="mb-3">
            <label for="address" class="form-label">address</label>
            <input type="text" class="form-control" id="address" />
        </div>
    </div>
</body>
</html>
